<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>QR Code Generator</h2>
    <div class="input-container">
      <input type="text" id="text-input" placeholder="Enter text or URL..." maxlength="500">
      <div id="error-message" class="error-message" style="display: none;"></div>
    </div>
    <button onclick="generateQR()" id="generate-btn">Generate QR Code</button>
    <div id="qrcode">
      <div class="empty-state">Enter some text above and click generate!</div>
    </div>
    <div id="download-section" style="display: none;">
      <button onclick="downloadQR()">Download QR Code</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

        <span id="button-text">✨ Generate QR Code</span>

        </button>

  </body>
</html>
